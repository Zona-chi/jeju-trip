function launchNaver(scheme, web) {
  let leftPage = false;
  const mark = () => { leftPage = true; };
  const onVis = () => { if (document.hidden) mark(); };

  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pagehide', mark);
  window.addEventListener('blur', mark);

  const cleanup = () => {
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('pagehide', mark);
    window.removeEventListener('blur', mark);
  };

  window.location.href = scheme;                 // 嘗試喚醒 Naver Map App

  setTimeout(() => {                             // Fallback：1.5 秒沒離開本頁就開網頁版
    cleanup();
    if (leftPage || document.hidden) return;
    window.location.href = web;
  }, 1500);
}

function openNaver(id) {
  const p = PLACES.find(x => x.id === id);
  if (!p) return;
  const dname = encodeURIComponent(p.name_kr);
  launchNaver(
    `nmap://route/public?dlat=${p.lat}&dlng=${p.lng}&dname=${dname}&appname=JejuTrip`,
    `https://map.naver.com/v5/directions/-/=${p.lng},${p.lat},${dname}/-/transit`
  );
}

// 清單裡沒有座標的地點（偶來市場、涉地可支…）：交給 Naver 自己用韓文名找
function openNaverSearch(nameKr) {
  const q = encodeURIComponent(nameKr);
  launchNaver(`nmap://search?query=${q}&appname=JejuTrip`, `https://map.naver.com/p/search/${q}`);
}

/* ===================== 複製韓文名 ===================== */
async function copyKr(id) {
  const p = PLACES.find(x => x.id === id);
  if (!p) return;
  try {
    await navigator.clipboard.writeText(p.name_kr);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = p.name_kr;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast('已複製「' + p.name_kr + '」');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

/* ===================== 渲染 ===================== */
function renderPills() {
  const counts = { all: PLACES.length };
  PLACES.forEach(p => counts[p.cat] = (counts[p.cat] || 0) + 1);

  document.getElementById('pills').innerHTML = CATS.map(c => {
    const on = c.key === activeCat;
    return `<button data-cat="${c.key}"
      class="pill shrink-0 px-4 py-1.5 rounded-full text-[13px] font-semibold transition-all duration-150 border
        ${on ? c.cls + ' border-transparent shadow-sm' : 'bg-white text-slate-500 border-slate-200'}">
      ${c.label}<span class="${on ? 'opacity-70' : 'opacity-50'} ml-1 text-[11px]">${counts[c.key] || 0}</span>
    </button>`;
  }).join('');

  document.querySelectorAll('.pill').forEach(b => b.onclick = () => {
    activeCat = b.dataset.cat;
    renderPills();
    renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function renderCards() {

          ${p.name_kr !== p.name ? `<p class="text-xs text-slate-400 mt-0.5">${p.name_kr}</p>` : ''}
        </div>

      </div>

      <p class="text-[13px] text-slate-600 leading-relaxed mt-2.5">${p.desc}</p>

      ${p.note && !p.desc.includes(p.note) ? `<p class="mt-2 text-[12px] text-sea-700 bg-sea-50 border border-sea-100 rounded-lg px-2.5 py-1.5 leading-relaxed">
          <span class="font-semibold">筆記</span>　${p.note}</p>` : ''}

      <div class="flex items-center gap-1.5 mt-3 text-[11px] text-slate-400">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        ${p.area}
      </div>

      <div class="flex gap-2 mt-3.5">
        <button onclick="openNaver(${p.id})"
          class="flex-1 flex items-center justify-center gap-1.5 bg-[#03C75A] active:bg-[#02a94d] text-white text-[13px] font-bold rounded-xl py-2.5 transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2Z"/></svg>
          導航 (Naver Map)

        </button>
        <a href="${p.gmaps}" target="_blank" rel="noopener" title="Google 地圖"
          class="w-11 flex items-center justify-center bg-slate-100 active:bg-slate-200 text-slate-500 rounded-xl transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 4 5v16l5-2 6 2 5-2V3l-5 2-6-2Z"/><path d="M9 3v16M15 5v16"/></svg>
        </a>
      </div>
    </article>`;
  }).join('');

const shortDate = d => d.slice(5).replace('/', '/');

/* ===================== 行程渲染 ===================== */
function renderPlan() {
  document.getElementById('daynav').innerHTML = TRIP.map((d, i) => `
    <button onclick="gotoDay(${i})"
      class="shrink-0 flex flex-col items-center leading-none px-3.5 py-1.5 rounded-xl bg-white border border-slate-200 text-slate-600">

  document.getElementById('days').innerHTML = TRIP.map((d, i) => {
    const closedWarn = d.meals.some(m => m.closed === d.wd);
    return `
    <article id="day-${i}" class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden">

      <div class="flex items-center gap-3 px-4 py-3 bg-gradient-to-r from-sea-50 to-white border-b border-slate-100">

          <p class="text-lg font-bold text-slate-900 leading-tight" style="font-variant-numeric:tabular-nums">${shortDate(d.date)}</p>

function actRow(a) {
  const p = a.pid ? P(a.pid) : null;
  const label = p ? p.name : a.t;
  const kr = p ? p.name_kr : (a.kr || '');
  const btn = p   ? `<button onclick="openNaver(${p.id})" ${navBtn('導航')}`
            : a.kr ? `<button onclick="openNaverSearch('${a.kr}')" ${navBtn('搜尋')}`
            : a.jump ? `<button onclick="jumpToArea('${a.jump}')"
                  class="shrink-0 bg-slate-100 active:bg-slate-200 text-slate-600 text-[11px] font-bold rounded-lg px-2.5 py-1.5">看清單</button>`
            : '';
  return `
    <div class="flex items-start gap-2.5">
      <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-sea-400 shrink-0"></span>
      <div class="min-w-0 flex-1">
        <p class="text-[13.5px] font-semibold text-slate-800 leading-snug">
          ${a.t}${a.rain ? '<span class="ml-1.5 text-[10px] font-bold bg-sea-100 text-sea-700 rounded px-1.5 py-0.5">雨備</span>' : ''}
        </p>
        ${(p && p.name !== a.t) || a.kr ? `<p class="text-[11px] text-slate-400 mt-0.5">${kr}</p>` : ''}
        ${a.note ? `<p class="text-[11.5px] text-slate-500 mt-0.5 leading-relaxed">${a.note}</p>` : ''}
      </div>
      ${btn}
    </div>`;

function navBtn(text) {
  return `class="shrink-0 bg-[#03C75A] active:bg-[#02a94d] text-white text-[11px] font-bold rounded-lg px-2.5 py-1.5">${text}</button>`;
}

function mealRow(m, d) {
  const p = m.pid ? P(m.pid) : null;
  const slotChip = `<span class="shrink-0 w-14 text-center text-[11px] font-bold rounded-lg py-1 ${SLOT_STYLE[m.slot] || 'bg-slate-100 text-slate-600'}">${m.slot}</span>`;
  const isClosed = m.closed === d.wd;

  if (!p) {
    const want = m.slot === 'coffee' ? 'cafe' : 'food';
    const sug = PLACES.filter(x => x.cat === want && d.near.some(k => x.area.startsWith(k))).slice(0, 3);
    return `
      <div class="flex items-start gap-2.5">
        ${slotChip}
        <div class="min-w-0 flex-1">
          <p class="text-[12.5px] text-slate-400 font-medium">未定${m.dish ? ' · ' + m.dish : ''}</p>
          ${sug.length ? `<div class="flex flex-wrap gap-1.5 mt-1.5">
            ${sug.map(s => `<button onclick="openNaver(${s.id})"
              class="text-[11px] bg-slate-50 border border-slate-200 active:bg-slate-100 rounded-lg px-2 py-1 text-slate-600 max-w-full truncate">
              ${s.name}</button>`).join('')}
            </div>
            <p class="text-[10.5px] text-slate-400 mt-1">↑ 這一帶清單裡的選擇，點了直接導航</p>` : ''}
        </div>
      </div>`;
  }

  return `
    <div class="flex items-start gap-2.5">
      ${slotChip}
      <div class="min-w-0 flex-1">
        ${m.dish ? `<p class="text-[11px] text-slate-400 font-medium">${m.dish}</p>` : ''}

        <div class="flex flex-wrap gap-1 mt-1.5">
          ${(m.tags || []).map(t => `<span class="text-[10px] font-bold bg-sea-100 text-sea-700 rounded px-1.5 py-0.5">${t}</span>`).join('')}

              ? `<span class="text-[10px] font-bold rounded px-1.5 py-0.5 ${isClosed ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600'}">
                   星期${WD[m.closed]}公休${isClosed ? '（就是今天）' : ''}</span>` : ''}
        </div>
      </div>
      <button onclick="openNaver(${p.id})" ${navBtn('導航')}

}

function gotoDay(i) {
  document.getElementById('day-' + i).scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function jumpToArea(area) {
  activeCat = 'all';
  keyword = area;
  document.getElementById('search').value = area;
  renderPills();
  renderCards();
  switchTab('list');
  window.scrollTo({ top: 0 });
}

/* ===================== 分頁切換 ===================== */
function switchTab(tab) {
  document.getElementById('app').dataset.view = tab;
  document.querySelectorAll('.nav-btn').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('text-sea-600', on);
    b.classList.toggle('text-slate-400', !on);
  });
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* ===================== 啟動 ===================== */
document.getElementById('search').addEventListener('input', e => {
  keyword = e.target.value;
  renderCards();
});
renderPills();
renderCards();
renderPlan();
</script>
