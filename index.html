<style>
  /* ---------- 基礎（單一淺色主題，顏色全部明確指定） ---------- */
  html, body { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #F3F5F2;
    color: #1B2A22;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { -webkit-text-size-adjust: 100%; }

  /* ---------- 背景：等高線紋理 + 柔和色塊 ---------- */
  .deco { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .deco-blobs {
    position: absolute; inset: 0;
    background:
      radial-gradient(48% 32% at 88% -4%, rgba(200,230,60,.30), transparent 70%),
      radial-gradient(52% 36% at 6% 22%, rgba(124,154,128,.20), transparent 72%),
      radial-gradient(60% 40% at 96% 104%, rgba(124,154,128,.18), transparent 70%),
      #F3F5F2;
  }

  /* ---------- 拱形 ---------- */
  .arch      { border-radius: 999px 999px 2rem 2rem; }
  .arch-tile { border-radius: 999px 999px .7rem .7rem; }

  /* ---------- 兩個分頁 ---------- */
  #view-plan, #view-places { display: block; }
  #app[data-view="plan"]   #view-places { display: none; }
  #app[data-view="places"] #view-plan   { display: none; }
  #days > article { scroll-margin-top: 5.2rem; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @supports (padding: env(safe-area-inset-bottom)) { .safe-b { margin-bottom: env(safe-area-inset-bottom); } }

  /* 液態玻璃：漸層玻璃面 + 內側高光；不支援 backdrop-filter 時退回較不透明的白底 */
  .glass {
    background: linear-gradient(158deg, rgba(255,255,255,.60), rgba(255,255,255,.40) 55%, rgba(255,255,255,.50));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.35);
  }
  /* 卡片用的淡版，透一點、玻璃感輕一點 */
  .glass-soft {
    background: linear-gradient(158deg, rgba(255,255,255,.50), rgba(255,255,255,.30) 55%, rgba(255,255,255,.42));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8), inset 0 -1px 0 rgba(255,255,255,.3);
  }
  @supports not ((backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px))) {
    .glass      { background: rgba(255,255,255,.92); }
    .glass-soft { background: rgba(255,255,255,.88); }
  }

  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  :focus-visible { outline: 2px solid #5A7A60; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---------- 載入畫面（純 CSS，不依賴 Tailwind） ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: #F3F5F2;
    transition: opacity .45s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .be {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: .32em; padding-left: .32em; color: #3F7A4E;
  }
  #boot .bw {
    font-family: "Plus Jakarta Sans", "Noto Sans TC", -apple-system, sans-serif;
    font-weight: 800; font-size: 54px; line-height: 1; letter-spacing: -.03em; color: #4F955E;
  }

  /* 字標本身做漸層流動：深綠 → 亮綠 → 粉紅 的光由左往右掃過字面。
     三個顏色直接取自山形素材：樹的深綠 #4F955E、山體亮綠 #4FBE7E、粉紅樹 #EEBDBC。
     用 @supports 包起來——不支援 background-clip:text 的瀏覽器
     會維持上面那條純色規則，不會變成一片透明看不見字。 */
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    #boot .bw {
      background-image: linear-gradient(135deg,
        #4F955E 0%,  #4F955E 28%, #4FBE7E 37%,
        #EEBDBC 44%, #EEBDBC 56%,
        #4FBE7E 63%, #4F955E 72%, #4F955E 100%);
      background-size: 300% 100%;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: boot-shimmer 2s ease-in-out infinite;
    }
  }
  @keyframes boot-shimmer {
    from { background-position: 100% 50%; }
    to   { background-position:   0% 50%; }
  }

  /* 上方小字：跟字標錯開相位的呼吸感 */
  #boot .be { animation: boot-breathe 2s ease-in-out infinite; animation-delay: -.7s; }
  @keyframes boot-breathe {
    0%, 100% { opacity: .45; }
    50%      { opacity: 1; }
  }

  /* 關掉動態效果時：漸層停在起點＝純深綠字，小字全不透明，看起來就是一張靜止的封面 */
  @media (prefers-reduced-motion: reduce) {
    #boot .bw { background-position: 0% 50%; }
    #boot .be { opacity: 1; }
  }

  .fade-in { animation: fade .24s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .tnum { font-variant-numeric: tabular-nums; }
</style>
<style>
  /* ============================================================
     環境動態特效（Ambient Animations）
     背景與等高線用 transform；天空漸層用 background-position 流動。
     ============================================================ */

  /* --- 1. 頁面背景光暈飄移 --- */
  @keyframes deco-drift {
    0%   { transform: translate3d(0, 0, 0)      scale(1);    }
    25%  { transform: translate3d(-5%, 3.5%, 0) scale(1.10); }
    50%  { transform: translate3d(3.5%, 6%, 0)  scale(1.18); }
    75%  { transform: translate3d(5%, -3%, 0)   scale(1.09); }
    100% { transform: translate3d(0, 0, 0)      scale(1);    }
  }
  .deco-blobs { inset: -26%; will-change: transform; animation: deco-drift 14s ease-in-out infinite; }

  /* --- 2. 等高線紋理浮動 --- */
  @keyframes topo-float-a {
    from { transform: translate3d(0, -28px, 0)   rotate(-3deg) scale(1);    }
    to   { transform: translate3d(18px, 26px, 0) rotate(3deg)  scale(1.08); }
  }
  @keyframes topo-float-b {
    from { transform: translate3d(0, 30px, 0)      rotate(2.5deg)  scale(1.06); }
    to   { transform: translate3d(-22px, -24px, 0) rotate(-2.5deg) scale(1);    }
  }
  .anim-topo    { will-change: transform; }
  .anim-topo--a { animation: topo-float-a 7s   ease-in-out infinite alternate; }
  .anim-topo--b { animation: topo-float-b 8.5s ease-in-out infinite alternate; }

  /* --- 4. 太陽：沿拱形東昇西落，22 秒一輪 --- */
  @keyframes sun-orbit {
    0%     { transform: translate(373.0px, 228.0px); }
    8.33%  { transform: translate(366.9px, 174.7px); }
    16.67% { transform: translate(349.2px, 125.0px); }
    25%    { transform: translate(320.9px, 82.3px); }
    33.33% { transform: translate(284.0px, 49.6px); }
    41.67% { transform: translate(241.1px, 29.0px); }
    50%    { transform: translate(195.0px, 22.0px); }
    58.33% { transform: translate(148.9px, 29.0px); }
    66.67% { transform: translate(106.0px, 49.6px); }
    75%    { transform: translate(69.1px, 82.3px); }
    83.33% { transform: translate(40.8px, 125.0px); }
    91.67% { transform: translate(23.1px, 174.7px); }
    100%   { transform: translate(17.0px, 228.0px); }
  }
  /* 大小與顏色：地平線附近偏橘、偏大、偏淡；正午轉萊姆黃綠、最亮最小 */
  @keyframes sun-cycle {
    0%   { fill: #E0843A; opacity: 0;   transform: scale(1.25); }
    5%   { fill: #E0843A; opacity: .28; transform: scale(1.22); }
    14%  { fill: #E4913C; opacity: .78; transform: scale(1.15); }
    28%  { fill: #DFB840; opacity: .95; transform: scale(1.05); }
    42%  { fill: #CFDC3E; opacity: 1;   transform: scale(.97);  }
    50%  { fill: #C8E63C; opacity: 1;   transform: scale(.95);  }
    58%  { fill: #CFDC3E; opacity: 1;   transform: scale(.97);  }
    72%  { fill: #DFB840; opacity: .95; transform: scale(1.05); }
    86%  { fill: #E4913C; opacity: .78; transform: scale(1.15); }
    95%  { fill: #E0843A; opacity: .28; transform: scale(1.22); }
    100% { fill: #E0843A; opacity: 0;   transform: scale(1.25); }
  }
  /* 光暈：地平線附近暖橘且大，正午轉萊姆且收斂 */
  @keyframes halo-warm {
    0%   { opacity: 0;   transform: scale(1.15); }
    8%   { opacity: .95; transform: scale(1.1);  }
    26%  { opacity: .8;  transform: scale(1);    }
    50%  { opacity: .18; transform: scale(.82);  }
    74%  { opacity: .8;  transform: scale(1);    }
    92%  { opacity: .95; transform: scale(1.1);  }
    100% { opacity: 0;   transform: scale(1.15); }
  }
  @keyframes halo-cool {
    0%, 100% { opacity: 0;   transform: scale(.8); }
    12%      { opacity: .25; transform: scale(.9); }
    50%      { opacity: 1;   transform: scale(1.1); }
    88%      { opacity: .25; transform: scale(.9); }
  }
  .anim-halo-warm { animation: halo-warm 22s ease-in-out infinite; }
  .anim-halo-cool { animation: halo-cool 22s ease-in-out infinite; }
  .anim-sun-orbit { animation: sun-orbit 22s linear infinite; will-change: transform; }
  .anim-sun-color { animation: sun-cycle 22s ease-in-out infinite; }

  /* --- 6. 雲與水波 --- */
  @keyframes cloud-drift {
    from { transform: translate3d(-26px, 5px, 0); }
    to   { transform: translate3d(26px, -7px, 0); }
  }
  @keyframes cloud-fade { from { opacity: .55; } to { opacity: 1; } }
  @keyframes wave-shift {
    from { transform: translate3d(-12px, 0, 0); }
    to   { transform: translate3d(12px, 3px, 0); }
  }
  .anim-cloud { animation: cloud-drift 9s ease-in-out infinite alternate,
                           cloud-fade 5s ease-in-out infinite alternate; }
  .anim-wave  { animation: wave-shift 4.5s ease-in-out infinite alternate; }

  /* --- 7. 前景素材漂浮 ---
     外層 .anim-float：不規則的 2D 微幅漂移（不是單純上下，落點每一段都不同）
     內層 .anim-sway-*：繞著各自的基準傾角緩慢擺盪
     兩層週期刻意取互質（6/7、4.5/5.5 秒），合成軌跡不會看出重複 */
  @keyframes float {
    0%   { transform: translate3d(  0px,   0px, 0); }
    22%  { transform: translate3d(-2.5px, -4px, 0); }
    45%  { transform: translate3d(  1px,  -7px, 0); }
    68%  { transform: translate3d(  3px,  -4px, 0); }
    85%  { transform: translate3d(1.5px, -1.5px, 0); }
    100% { transform: translate3d(  0px,   0px, 0); }
  }
  @keyframes sway-cw  { 0%, 100% { transform: rotate(14deg); }  50% { transform: rotate(16deg); } }
  @keyframes sway-ccw { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(-14deg); } }

  .anim-float        { animation: float 6s ease-in-out infinite; will-change: transform; }
  .anim-float--fast  { animation-duration: 4.5s; animation-delay: -1.7s; }
  .anim-sway-cw      { animation: sway-cw 7s ease-in-out infinite; will-change: transform; }
  .anim-sway-ccw     { animation: sway-ccw 5.5s ease-in-out infinite; animation-delay: -2.3s;
                       will-change: transform; }

</style>

</head>
<body>

<!-- 載入畫面：字型與版面就緒後淡出，最慢 2.4 秒一定收起來 -->
<div id="boot" role="status" aria-label="載入中">
  <p class="be">OCT 2026 &middot; 6 DAYS</p>
  <p class="bw">JEJU</p>
</div>
<!-- ===== 最底層裝飾：柔和色塊 + 等高線 ===== -->
<div class="deco" aria-hidden="true">
  <div class="deco-blobs"></div>
  <svg class="anim-topo anim-topo--a absolute -top-24 -right-40 w-[420px] h-[420px]" viewBox="0 0 200 200" fill="none">
    <g stroke="#7C9A80" stroke-opacity=".16" stroke-width=".8">
      <ellipse cx="100" cy="100" rx="26" ry="18" transform="rotate(-18 100 100)"/>
      <ellipse cx="100" cy="100" rx="40" ry="28" transform="rotate(-18 100 100)"/>
      <ellipse cx="100" cy="100" rx="55" ry="38" transform="rotate(-18 100 100)"/>
      <ellipse cx="100" cy="100" rx="70" ry="49" transform="rotate(-18 100 100)"/>
      <ellipse cx="100" cy="100" rx="85" ry="60" transform="rotate(-18 100 100)"/>
      <ellipse cx="100" cy="100" rx="99" ry="71" transform="rotate(-18 100 100)"/>
    </g>
  </svg>
  <svg class="anim-topo anim-topo--b absolute bottom-[-120px] -left-32 w-[380px] h-[380px]" viewBox="0 0 200 200" fill="none">
    <g stroke="#7C9A80" stroke-opacity=".14" stroke-width=".8">
      <ellipse cx="100" cy="100" rx="22" ry="30" transform="rotate(24 100 100)"/>
      <ellipse cx="100" cy="100" rx="35" ry="46" transform="rotate(24 100 100)"/>
      <ellipse cx="100" cy="100" rx="49" ry="63" transform="rotate(24 100 100)"/>
      <ellipse cx="100" cy="100" rx="63" ry="80" transform="rotate(24 100 100)"/>
      <ellipse cx="100" cy="100" rx="78" ry="97" transform="rotate(24 100 100)"/>
    </g>
  </svg>
</div>

<div id="app" data-view="plan" class="relative z-10 mx-auto w-full max-w-md min-h-dvh">

  <!-- ==================== 分頁 1：行程 ==================== -->
  <section id="view-plan">
    <header class="pt-8">
      <div class="px-5 flex items-start justify-between">
        <div>
          <p class="font-mono text-[10px] tracking-[0.32em] text-sage-deep">OCT 2026 · 6 DAYS</p>
          <h1 class="font-display text-[52px] font-extrabold leading-[0.95] tracking-[-0.03em] text-forest mt-1">JEJU</h1>
        </div>
        <div class="glass backdrop-blur-xl ring-1 ring-white/60 shadow-sm rounded-full px-3.5 py-2 text-center">
          <p class="font-mono text-[9px] tracking-[0.14em] text-ink-dim">TRIP</p>
          <p class="font-display text-[13px] font-extrabold text-forest tnum">10/24–29</p>
        </div>
      </div>

      <!-- 拱形視覺區塊：天空漸層在容器上流動，太陽沿拱形東昇西落 -->
      <div class="relative overflow-hidden mt-5 h-64">

        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 240 232"
             preserveAspectRatio="xMinYMax meet" aria-hidden="true">
          <defs>
            <radialGradient id="haloWarm">
              <stop offset="0" stop-color="#E0843A" stop-opacity=".55"/>
              <stop offset=".45" stop-color="#E0843A" stop-opacity=".22"/>
              <stop offset="1" stop-color="#E0843A" stop-opacity="0"/>
            </radialGradient>
            <!-- 光暈的頂部淡出遮罩：y=0 全透明 → y≈22 全顯示，所以上緣不會有直邊 -->
            <linearGradient id="haloFade" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fff" stop-opacity="0"/>
              <stop offset=".09" stop-color="#fff" stop-opacity="1"/>
            </linearGradient>
            <mask id="haloMask" maskUnits="userSpaceOnUse" x="-120" y="-140" width="640" height="520">
              <rect x="-120" y="-140" width="640" height="520" fill="url(#haloFade)"/>
            </mask>
            <radialGradient id="haloCool">
              <stop offset="0" stop-color="#C8E63C" stop-opacity=".5"/>
              <stop offset=".5" stop-color="#C8E63C" stop-opacity=".16"/>
              <stop offset="1" stop-color="#C8E63C" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- 雲 -->
          <g class="anim-cloud" stroke="#7C9A80" stroke-opacity=".26" stroke-width="1"
             fill="none" stroke-linecap="round">
            <path d="M42,18 C53,10 64,10 75,18"/><path d="M52,30 C62,24 72,24 82,30"/>
          </g>

          <!-- 太陽：外層沿拱形走位，內層做大小與顏色變化 -->
          <g mask="url(#haloMask)">
            <g class="anim-sun-orbit">
              <ellipse class="anim-halo-warm" rx="96" ry="56" fill="url(#haloWarm)"/>
              <ellipse class="anim-halo-cool" rx="68" ry="40" fill="url(#haloCool)"/>
            </g>
          </g>
          <g class="anim-sun-orbit">
            <circle class="anim-sun-color" r="18" fill="#C8E63C"/>
          </g>

/* =========================================================
   Naver Map / Google Maps
   ========================================================= */
function launchNaver(scheme, web) {
  let left = false;
  const mark = () => { left = true; };
  const onVis = () => { if (document.hidden) mark(); };
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pagehide', mark);
  window.addEventListener('blur', mark);
  const cleanup = () => {
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('pagehide', mark);
    window.removeEventListener('blur', mark);
  };
  window.location.href = scheme;                    // 嘗試喚醒 Naver Map App
  setTimeout(() => {                                // 1.5 秒沒離開本頁 → 開網頁版
    cleanup();
    if (left || document.hidden) return;
    window.location.href = web;
  }, 1500);
}
function navRoute(lat, lng, kr) {
  const d = encodeURIComponent(kr);
  launchNaver(`nmap://route/public?dlat=${lat}&dlng=${lng}&dname=${d}&appname=JejuTrip`,
              `https://map.naver.com/v5/directions/-/=${lng},${lat},${d}/-/transit`);
}
function navSearch(q) {
  const s = encodeURIComponent(q);
  launchNaver(`nmap://search?query=${s}&appname=JejuTrip`, `https://map.naver.com/p/search/${s}`);
}
function naverById(id) {
  const p = PLACES.find(x => x.id === id);
  if (!p) return;
  // 有精準座標就走路線導航；沒有的就交給 Naver 用韓文名搜尋
  if (p.lat && p.lng) navRoute(p.lat, p.lng, p.name_kr);
  else navSearch(p.name_kr);
}
function copyKr(id) {
  const p = PLACES.find(x => x.id === id);
  if (p) copyText(p.name_kr);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast('已複製：' + t);
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1900);
}

/* =========================================================
   分頁 1：行程
   ========================================================= */
const hairline = '<div class="h-px bg-ink-line/70 ml-[62px] my-3"></div>';

function renderPlan() {
  document.getElementById('daynav').innerHTML = TRIP.map((d, i) => `
    <button onclick="gotoDay(${i})" data-i="${i}"
      class="dayPill shrink-0 flex flex-col items-center leading-none px-4 py-2 rounded-2xl ring-1 transition-colors">
      <span class="font-display text-[13px] font-extrabold tnum">${d.date.slice(5)}</span>
      <span class="text-[10px] mt-1">${WD[d.wd]}</span>
    </button>`).join('');

  document.getElementById('days').innerHTML = TRIP.map((d, i) => {
    const closedToday = d.items.some(x => x.closed === d.wd);
    return `
    <article id="day-${i}" class="fade-in glass-soft backdrop-blur-xl ring-1 ring-white/60 shadow-sm rounded-4xl overflow-hidden">

      <div class="flex items-center gap-3.5 px-4 pt-4 pb-3.5">
        <div class="shrink-0 arch-tile w-11 h-[52px] bg-forest text-lime flex flex-col items-center justify-center gap-0.5">
          <span class="font-mono text-[8.5px] tracking-[0.1em] opacity-80">DAY</span>
          <span class="font-display text-[17px] font-extrabold leading-none">${i + 1}</span>
        </div>
        <div class="min-w-0 flex-1">
          <p class="font-display text-[19px] font-extrabold text-forest leading-none tnum">${d.date.slice(5)}
            <span class="text-[12px] font-bold text-ink-mid ml-1">星期${WD[d.wd]}</span></p>
          <p class="text-[11.5px] text-sage-deep font-medium mt-1.5">${d.zones.map(z => '【' + z + '】').join('')}</p>
        </div>
      </div>

      ${d.warn || closedToday ? `<div class="flex flex-wrap gap-1.5 px-4 pb-3">
        ${d.warn ? `<span class="text-[10.5px] font-bold bg-lime-soft text-lime-deep rounded-lg px-2 py-1">${d.warn}</span>` : ''}
        ${closedToday ? `<span class="text-[10.5px] font-bold bg-clay/12 text-clay rounded-lg px-2 py-1">有店家今天公休</span>` : ''}
      </div>` : ''}

      <div class="px-4 pb-4">${d.items.map(it => row(it, d)).join(hairline)}</div>

      <svg class="block w-full h-4" viewBox="0 0 320 16" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,9 C26,2 52,2 78,9 C104,16 130,16 156,9 C182,2 208,2 234,9 C260,16 286,16 312,9 L320,7 L320,16 L0,16 Z" fill="#C7D8C6" fill-opacity=".55"/>
      </svg>
    </article>`;
  }).join('');
}

function row(it, day) {
  const c = CAT[it.cat] || CAT.sight;
  const isClosed = it.closed === day.wd;

  const action =
    it.nav && it.nav.lat
      ? `<button onclick="navRoute(${it.nav.lat},${it.nav.lng},'${it.nav.kr}')"
           class="shrink-0 flex items-center gap-1 bg-naver active:brightness-95 text-white text-[11px] font-bold rounded-full px-3 py-1.5">
           ${icon('nav', 'w-3.5 h-3.5')}導航</button>`
      : it.nav && it.nav.q
      ? `<button onclick="navSearch('${it.nav.q}')"
           class="shrink-0 flex items-center gap-1 bg-white ring-1 ring-naver/45 active:bg-naver/10 text-naver text-[11px] font-bold rounded-full px-3 py-1.5">
           ${icon('search', 'w-3.5 h-3.5')}搜尋</button>`
      : '';

  const copyBtn = it.copy
    ? `<button onclick="copyText('${it.copy.replace(/'/g, "\\'")}')" aria-label="複製地址"
         class="shrink-0 w-8 h-8 flex items-center justify-center bg-white ring-1 ring-ink-line active:bg-paper text-ink-mid rounded-full">
         ${icon('copy', 'w-4 h-4')}</button>`
    : '';

  return `
    <div class="flex items-start gap-3.5">
      <div class="shrink-0 w-11 h-11 rounded-full ${TONE[c.tone]} flex items-center justify-center">
        ${icon(c.icon, 'w-[19px] h-[19px]')}
      </div>

      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="font-mono text-[9.5px] tracking-[0.14em] uppercase text-ink-dim">${c.label}</span>
          ${it.rain ? `<span class="text-[9.5px] font-bold bg-sage-tint text-sage-deep rounded px-1.5">雨備</span>` : ''}
          ${(it.tags || []).map(t => `<span class="text-[9.5px] font-bold bg-forest text-lime rounded px-1.5">${t}</span>`).join('')}
        </div>

        <p class="text-[14.5px] font-bold text-forest leading-snug mt-1">${it.title}</p>
        ${it.dish ? `<p class="text-[12px] text-clay font-medium mt-0.5">${it.dish}</p>` : ''}
        ${it.kr ? `<p class="font-mono text-[10.5px] text-ink-dim mt-0.5">${it.kr}</p>` : ''}
        ${it.note ? `<p class="text-[12px] text-ink-mid mt-1 leading-relaxed">${it.note}</p>` : ''}

        ${it.hours || typeof it.closed === 'number' ? `<div class="flex flex-wrap gap-1.5 mt-1.5">
          ${it.hours ? `<span class="font-mono text-[10px] bg-paper text-ink-mid ring-1 ring-ink-line rounded px-1.5 py-0.5">${it.hours}</span>` : ''}
          ${typeof it.closed === 'number'
            ? `<span class="text-[10px] font-bold rounded px-1.5 py-0.5 ${isClosed ? 'bg-clay text-white' : 'bg-paper text-ink-mid ring-1 ring-ink-line'}">
                 星期${WD[it.closed]}公休${isClosed ? '（就是今天）' : ''}</span>` : ''}
        </div>` : ''}
      </div>

      <div class="flex flex-col gap-1.5 items-end">${action}${copyBtn}</div>
    </div>`;
}

function markDay(i) {
  document.querySelectorAll('.dayPill').forEach(b => {
    const on = +b.dataset.i === i;
    b.className = 'dayPill shrink-0 flex flex-col items-center leading-none px-4 py-2 rounded-2xl ring-1 transition-colors ' +
      (on ? 'bg-forest text-lime ring-forest' : 'bg-white/70 text-ink-mid ring-white/80');
    b.querySelector('span:last-child').className = 'text-[10px] mt-1 ' + (on ? 'text-lime/75' : 'text-ink-dim');
  });
}
function gotoDay(i) {
  document.getElementById('day-' + i).scrollIntoView({ behavior: 'smooth', block: 'start' });
  markDay(i);
}
function watchDays() {
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting)
                       .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (vis.length) markDay(+vis[0].target.id.split('-')[1]);
  }, { rootMargin: '-84px 0px -55% 0px', threshold: 0 });
  document.querySelectorAll('#days > article').forEach(el => io.observe(el));
}

/* =========================================================
   分頁 2：地點清單
   ========================================================= */
let activeCat = 'all';
let keyword = '';

function renderPills() {
  const counts = { all: PLACES.length };
  PLACES.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);

  document.getElementById('pills').innerHTML = PCATS.map(c => {
    const on = c.key === activeCat;
    return `<button data-cat="${c.key}"
      class="pill shrink-0 flex items-center gap-1.5 rounded-full pl-2.5 pr-3.5 py-1.5 ring-1 transition-colors
        ${on ? 'bg-forest text-lime ring-forest' : 'bg-white/70 text-ink-mid ring-white/80'}">
      ${icon(c.icon, 'w-3.5 h-3.5')}
      <span class="text-[12.5px] font-bold">${c.label}</span>
      <span class="font-mono text-[10px] ${on ? 'text-lime/70' : 'text-ink-dim'}">${counts[c.key] || 0}</span>
    </button>`;
  }).join('');

  document.querySelectorAll('.pill').forEach(b => b.onclick = () => {
    activeCat = b.dataset.cat;
    renderPills(); renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function renderCards() {
  const kw = keyword.trim().toLowerCase();
  const list = PLACES.filter(p => {
    if (activeCat !== 'all' && p.category !== activeCat) return false;
    if (!kw) return true;
    return (p.name + ' ' + p.name_kr + ' ' + (p.alt || '') + ' ' + p.region + ' ' +
            p.description + ' ' + p.category).toLowerCase().includes(kw);
  });

  document.getElementById('count').textContent = list.length;

  if (!list.length) {
    document.getElementById('cards').innerHTML =
      `<div class="text-center py-20 text-ink-dim text-sm">找不到符合的地點<br><span class="text-xs">試試其他關鍵字</span></div>`;
    return;
  }

  document.getElementById('cards').innerHTML = list.map(p => {
    const c = pcat(p.category);
    return `
    <article class="fade-in glass-soft backdrop-blur-xl ring-1 ring-white/60 shadow-sm rounded-4xl p-4">
      <div class="flex items-start gap-3.5">
        <div class="shrink-0 arch-tile w-11 h-[52px] ${TONE[c.tone]} flex items-center justify-center">
          ${icon(c.icon, 'w-[19px] h-[19px]')}
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-mono text-[9.5px] tracking-[0.14em] ${CAT_FG[p.category] || 'text-ink-dim'}">${p.category}</span>
            <span class="bg-paper text-ink-mid ring-1 ring-ink-line rounded-full text-[10px] font-semibold px-2 py-0.5">${p.region}</span>
          </div>
          <p class="text-[14.5px] font-bold text-forest leading-snug mt-1 break-words">${p.name}</p>
          ${p.name_kr !== p.name ? `<p class="font-mono text-[10.5px] text-ink-dim mt-0.5">${p.name_kr}</p>` : ''}
        </div>
      </div>

      <p class="text-[12.5px] text-ink-mid leading-relaxed mt-2.5">${p.description}</p>

      <div class="flex gap-2 mt-3.5">
        <button onclick="naverById(${p.id})"
          class="flex-1 flex items-center justify-center gap-1.5 bg-naver active:brightness-95 text-white text-[12.5px] font-bold rounded-full py-2.5">
          ${icon(p.lat ? 'nav' : 'search', 'w-4 h-4')}${p.lat ? 'Naver 導航' : 'Naver 搜尋'}
        </button>
        <a href="${p.gmaps}" target="_blank" rel="noopener"
          class="flex items-center justify-center gap-1.5 bg-gblue active:brightness-95 text-white text-[12.5px] font-bold rounded-full px-3.5 py-2.5">
          ${icon('pin', 'w-4 h-4')}Google
        </a>
        <button onclick="copyKr(${p.id})" aria-label="複製韓文名"
          class="shrink-0 w-10 flex items-center justify-center bg-white ring-1 ring-ink-line active:bg-paper text-ink-mid rounded-full">
          ${icon('copy', 'w-4 h-4')}
        </button>
      </div>
    </article>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', e => {
  keyword = e.target.value;
  if (keyword.trim() && activeCat !== 'all') { activeCat = 'all'; renderPills(); }  // 打字時解除類別篩選
  renderCards();
});

/* =========================================================
   分頁切換
   ========================================================= */
function switchTab(tab) {
  document.getElementById('app').dataset.view = tab;
  document.querySelectorAll('.navBtn').forEach((b, i) => {
    const on = b.dataset.tab === tab;
    b.className = 'navBtn flex-1 flex items-center justify-center gap-2 rounded-full py-2.5 transition-colors ' +
      (on ? 'bg-forest text-lime' : 'text-ink-mid');
    b.querySelector('.navIcon').innerHTML = icon(i === 0 ? 'calendar' : 'list', 'w-[18px] h-[18px]');
  });
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.navBtn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* =========================================================
   啟動
   ========================================================= */
document.getElementById('searchIcon').innerHTML = icon('search', 'w-4 h-4');
renderPlan();
markDay(0);
watchDays();
renderPills();
renderCards();
switchTab('plan');

/* ---------- 收起載入畫面 ---------- */
(function () {
  const boot = document.getElementById('boot');
  if (!boot) return;
  let done = false;
  const hide = () => {
    if (done) return;
    done = true;
    boot.classList.add('gone');
    setTimeout(() => boot.remove(), 500);
  };
  // 兩個條件都成立才淡出：
  //   1. 字型就緒（最多等 1.8 秒）
  //   2. 至少停留 2000ms —— 剛好是漸層動畫一整輪，讓它跑完再走
  const fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready.catch(() => {}) : Promise.resolve();
  Promise.all([
    Promise.race([fonts, new Promise(r => setTimeout(r, 1800))]),
    new Promise(r => setTimeout(r, 2000)),
  ]).then(() => requestAnimationFrame(hide));
  setTimeout(hide, 3000);   // 保險：CDN 掛掉也不會卡在載入畫面
})();

</script>
