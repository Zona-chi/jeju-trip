  .glass { background: rgba(255,255,255,.72); }

  .fade-in { animation: fade .24s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

function launchNaver(scheme, web) {
  let left = false;
  const mark = () => { left = true; };
  const onVis = () => { if (document.hidden) mark(); };
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pagehide', mark);
  window.addEventListener('blur', mark);
  const cleanup = () => {
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('pagehide', mark);
    window.removeEventListener('blur', mark);
  };
  window.location.href = scheme;                    // 嘗試喚醒 Naver Map App
  setTimeout(() => {                                // 1.5 秒沒離開本頁 → 開網頁版
    cleanup();
    if (left || document.hidden) return;
    window.location.href = web;
  }, 1500);
}
function navRoute(lat, lng, kr) {
  const d = encodeURIComponent(kr);
  launchNaver(`nmap://route/public?dlat=${lat}&dlng=${lng}&dname=${d}&appname=JejuTrip`,
              `https://map.naver.com/v5/directions/-/=${lng},${lat},${d}/-/transit`);
}
function navSearch(q) {
  const s = encodeURIComponent(q);
  launchNaver(`nmap://search?query=${s}&appname=JejuTrip`, `https://map.naver.com/p/search/${s}`);
}
function naverById(id) {
  const p = PLACES.find(x => x.id === id);
  if (p) navRoute(p.lat, p.lng, p.name_kr);
}
function copyKr(id) {
  const p = PLACES.find(x => x.id === id);
  if (p) copyText(p.name_kr);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast('已複製：' + t);
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1900);
}

/* =========================================================
   分頁 1：行程
   ========================================================= */
const hairline = '<div class="h-px bg-ink-line/70 ml-[62px] my-3"></div>';

function renderPlan() {
  document.getElementById('daynav').innerHTML = TRIP.map((d, i) => `
    <button onclick="gotoDay(${i})" data-i="${i}"
      class="dayPill shrink-0 flex flex-col items-center leading-none px-4 py-2 rounded-2xl ring-1 transition-colors">
      <span class="font-display text-[13px] font-extrabold tnum">${d.date.slice(5)}</span>
      <span class="text-[10px] mt-1">${WD[d.wd]}</span>
    </button>`).join('');

  document.getElementById('days').innerHTML = TRIP.map((d, i) => {
    const closedToday = d.items.some(x => x.closed === d.wd);
    return `
    <article id="day-${i}" class="fade-in glass backdrop-blur-md ring-1 ring-white/70 shadow-sm rounded-4xl overflow-hidden">

      <div class="flex items-center gap-3.5 px-4 pt-4 pb-3.5">
        <div class="shrink-0 arch-tile w-11 h-[52px] bg-forest text-lime flex flex-col items-center justify-center gap-0.5">
          <span class="font-mono text-[8.5px] tracking-[0.1em] opacity-80">DAY</span>
          <span class="font-display text-[17px] font-extrabold leading-none">${i + 1}</span>
        </div>
        <div class="min-w-0 flex-1">
          <p class="font-display text-[19px] font-extrabold text-forest leading-none tnum">${d.date.slice(5)}
            <span class="text-[12px] font-bold text-ink-mid ml-1">星期${WD[d.wd]}</span></p>
          <p class="text-[11.5px] text-sage-deep font-medium mt-1.5">${d.zones.map(z => '【' + z + '】').join('')}</p>
        </div>
      </div>

      ${d.warn || closedToday ? `<div class="flex flex-wrap gap-1.5 px-4 pb-3">
        ${d.warn ? `<span class="text-[10.5px] font-bold bg-lime-soft text-lime-deep rounded-lg px-2 py-1">${d.warn}</span>` : ''}
        ${closedToday ? `<span class="text-[10.5px] font-bold bg-clay/12 text-clay rounded-lg px-2 py-1">有店家今天公休</span>` : ''}
      </div>` : ''}

      <div class="px-4 pb-4">${d.items.map(it => row(it, d)).join(hairline)}</div>

      <svg class="block w-full h-4" viewBox="0 0 320 16" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,9 C26,2 52,2 78,9 C104,16 130,16 156,9 C182,2 208,2 234,9 C260,16 286,16 312,9 L320,7 L320,16 L0,16 Z" fill="#C7D8C6" fill-opacity=".55"/>
      </svg>
    </article>`;
  }).join('');
}

function row(it, day) {
  const c = CAT[it.cat] || CAT.sight;
  const isClosed = it.closed === day.wd;

  const action =
    it.nav && it.nav.lat
      ? `<button onclick="navRoute(${it.nav.lat},${it.nav.lng},'${it.nav.kr}')"
           class="shrink-0 flex items-center gap-1 bg-naver active:brightness-95 text-white text-[11px] font-bold rounded-full px-3 py-1.5">
           ${icon('nav', 'w-3.5 h-3.5')}導航</button>`
      : it.nav && it.nav.q
      ? `<button onclick="navSearch('${it.nav.q}')"
           class="shrink-0 flex items-center gap-1 bg-white ring-1 ring-naver/45 active:bg-naver/10 text-naver text-[11px] font-bold rounded-full px-3 py-1.5">
           ${icon('search', 'w-3.5 h-3.5')}搜尋</button>`
      : '';

  const copyBtn = it.copy
    ? `<button onclick="copyText('${it.copy.replace(/'/g, "\\'")}')" aria-label="複製地址"
         class="shrink-0 w-8 h-8 flex items-center justify-center bg-white ring-1 ring-ink-line active:bg-paper text-ink-mid rounded-full">
         ${icon('copy', 'w-4 h-4')}</button>`
    : '';

  return `
    <div class="flex items-start gap-3.5">
      <div class="shrink-0 w-11 h-11 rounded-full ${TONE[c.tone]} flex items-center justify-center">
        ${icon(c.icon, 'w-[19px] h-[19px]')}
      </div>

      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="font-mono text-[9.5px] tracking-[0.14em] uppercase text-ink-dim">${c.label}</span>
          ${it.rain ? `<span class="text-[9.5px] font-bold bg-sage-tint text-sage-deep rounded px-1.5">雨備</span>` : ''}
          ${(it.tags || []).map(t => `<span class="text-[9.5px] font-bold bg-forest text-lime rounded px-1.5">${t}</span>`).join('')}
        </div>

        <p class="text-[14.5px] font-bold text-forest leading-snug mt-1">${it.title}</p>
        ${it.dish ? `<p class="text-[12px] text-clay font-medium mt-0.5">${it.dish}</p>` : ''}
        ${it.kr ? `<p class="font-mono text-[10.5px] text-ink-dim mt-0.5">${it.kr}</p>` : ''}
        ${it.note ? `<p class="text-[12px] text-ink-mid mt-1 leading-relaxed">${it.note}</p>` : ''}

        ${it.hours || typeof it.closed === 'number' ? `<div class="flex flex-wrap gap-1.5 mt-1.5">
          ${it.hours ? `<span class="font-mono text-[10px] bg-paper text-ink-mid ring-1 ring-ink-line rounded px-1.5 py-0.5">${it.hours}</span>` : ''}
          ${typeof it.closed === 'number'
            ? `<span class="text-[10px] font-bold rounded px-1.5 py-0.5 ${isClosed ? 'bg-clay text-white' : 'bg-paper text-ink-mid ring-1 ring-ink-line'}">
                 星期${WD[it.closed]}公休${isClosed ? '（就是今天）' : ''}</span>` : ''}
        </div>` : ''}
      </div>

      <div class="flex flex-col gap-1.5 items-end">${action}${copyBtn}</div>
    </div>`;
}

function markDay(i) {
  document.querySelectorAll('.dayPill').forEach(b => {
    const on = +b.dataset.i === i;
    b.className = 'dayPill shrink-0 flex flex-col items-center leading-none px-4 py-2 rounded-2xl ring-1 transition-colors ' +
      (on ? 'bg-forest text-lime ring-forest' : 'bg-white/70 text-ink-mid ring-white/80');
    b.querySelector('span:last-child').className = 'text-[10px] mt-1 ' + (on ? 'text-lime/75' : 'text-ink-dim');
  });
}
function gotoDay(i) {
  document.getElementById('day-' + i).scrollIntoView({ behavior: 'smooth', block: 'start' });
  markDay(i);
}
function watchDays() {
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting)
                       .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (vis.length) markDay(+vis[0].target.id.split('-')[1]);
  }, { rootMargin: '-84px 0px -55% 0px', threshold: 0 });
  document.querySelectorAll('#days > article').forEach(el => io.observe(el));
}

/* =========================================================
   分頁 2：地點清單
   ========================================================= */
let activeCat = 'all';
let keyword = '';

function renderPills() {
  const counts = { all: PLACES.length };
  PLACES.forEach(p => counts[p.cat] = (counts[p.cat] || 0) + 1);

  document.getElementById('pills').innerHTML = PCATS.map(c => {
    const on = c.key === activeCat;
    return `<button data-cat="${c.key}"
      class="pill shrink-0 flex items-center gap-1.5 rounded-full pl-2.5 pr-3.5 py-1.5 ring-1 transition-colors
        ${on ? 'bg-forest text-lime ring-forest' : 'bg-white/70 text-ink-mid ring-white/80'}">
      ${icon(c.icon, 'w-3.5 h-3.5')}
      <span class="text-[12.5px] font-bold">${c.label}</span>
      <span class="font-mono text-[10px] ${on ? 'text-lime/70' : 'text-ink-dim'}">${counts[c.key] || 0}</span>
    </button>`;
  }).join('');

  document.querySelectorAll('.pill').forEach(b => b.onclick = () => {
    activeCat = b.dataset.cat;
    renderPills(); renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function renderCards() {
  const kw = keyword.trim().toLowerCase();
  const list = PLACES.filter(p => {
    if (activeCat !== 'all' && p.cat !== activeCat) return false;
    if (!kw) return true;
    return (p.name + ' ' + p.name_kr + ' ' + p.area + ' ' + p.desc + ' ' + (p.note || '')).toLowerCase().includes(kw);
  });

  document.getElementById('count').textContent = list.length;

  if (!list.length) {
    document.getElementById('cards').innerHTML =
      `<div class="text-center py-20 text-ink-dim text-sm">找不到符合的地點<br><span class="text-xs">試試其他關鍵字</span></div>`;
    return;
  }

  document.getElementById('cards').innerHTML = list.map(p => {
    const c = pcat(p.cat);
    return `
    <article class="fade-in glass backdrop-blur-md ring-1 ring-white/70 shadow-sm rounded-4xl p-4">
      <div class="flex items-start gap-3.5">
        <div class="shrink-0 arch-tile w-11 h-[52px] ${TONE[c.tone]} flex items-center justify-center">
          ${icon(c.icon, 'w-[19px] h-[19px]')}
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-[14.5px] font-bold text-forest leading-snug break-words">${p.name}</p>
          ${p.name_kr !== p.name ? `<p class="font-mono text-[10.5px] text-ink-dim mt-0.5">${p.name_kr}</p>` : ''}
          <p class="text-[11px] text-sage-deep font-medium mt-1 flex items-center gap-1">
            ${icon('pin', 'w-3 h-3')}${p.area}</p>
        </div>
        <span class="shrink-0 font-mono text-[9.5px] tracking-[0.12em] uppercase text-ink-dim">${c.label}</span>
      </div>

      <p class="text-[12.5px] text-ink-mid leading-relaxed mt-3">${p.desc}</p>
      ${p.note && !p.desc.includes(p.note)
        ? `<p class="text-[12px] text-forest bg-lime-soft/70 rounded-xl px-3 py-2 mt-2.5 leading-relaxed">
             <span class="font-bold">筆記</span>　${p.note}</p>` : ''}

      <div class="flex gap-2 mt-3.5">
        <button onclick="naverById(${p.id})"
          class="flex-1 flex items-center justify-center gap-1.5 bg-naver active:brightness-95 text-white text-[12.5px] font-bold rounded-full py-2.5">
          ${icon('nav', 'w-4 h-4')}Naver 導航
        </button>
        <a href="${p.gmaps}" target="_blank" rel="noopener"
          class="flex items-center justify-center gap-1.5 bg-gblue active:brightness-95 text-white text-[12.5px] font-bold rounded-full px-3.5 py-2.5">
          ${icon('pin', 'w-4 h-4')}Google
        </a>
        <button onclick="copyKr(${p.id})" aria-label="複製韓文名"
          class="shrink-0 w-10 flex items-center justify-center bg-white ring-1 ring-ink-line active:bg-paper text-ink-mid rounded-full">
          ${icon('copy', 'w-4 h-4')}
        </button>
      </div>
    </article>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', e => {
  keyword = e.target.value;
  if (keyword.trim() && activeCat !== 'all') { activeCat = 'all'; renderPills(); }  // 打字時解除類別篩選
  renderCards();
});

/* =========================================================
   分頁切換
   ========================================================= */
function switchTab(tab) {
  document.getElementById('app').dataset.view = tab;
  document.querySelectorAll('.navBtn').forEach((b, i) => {
    const on = b.dataset.tab === tab;
    b.className = 'navBtn flex-1 flex items-center justify-center gap-2 rounded-full py-2.5 transition-colors ' +
      (on ? 'bg-forest text-lime' : 'text-ink-mid');
    b.querySelector('.navIcon').innerHTML = icon(i === 0 ? 'calendar' : 'list', 'w-[18px] h-[18px]');
  });
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.navBtn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* =========================================================
   啟動
   ========================================================= */
document.getElementById('searchIcon').innerHTML = icon('search', 'w-4 h-4');
renderPlan();
markDay(0);
watchDays();
renderPills();
renderCards();
switchTab('plan');

</script>
</body>
</html>
